name: CI and Docker Hub publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Check Docker Hub credentials
        id: dockerhub
        if: github.event_name == 'push'
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && steps.dockerhub.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image without publishing
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && steps.dockerhub.outputs.available != 'true')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
      - name: Build and publish image (main branch)
        if: github.event_name == 'push' && steps.dockerhub.outputs.available == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            abhijeetchy51/ai-resume-analyser:latest
            abhijeetchy51/ai-resume-analyser:${{ github.sha }}
